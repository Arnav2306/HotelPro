services:
  - type: web
    name: hotelpro-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard — never hardcode
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard — never hardcode
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false  # Set to your Vercel frontend URL in Render dashboard
